<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - LOGISTICS</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1 class="logo">LOGISTICS</h1>
        <p class="subtitle">ADMINISTRATION</p>
    </header>

    <main class="container">
        <section class="admin-panel">
            <h2 class="section-title">DATA MANAGEMENT</h2>
            
            <div class="card mt-4">
                <h3>DOWNLOAD SUBMISSIONS</h3>
                <p>Download all closing stock submissions from delivery partners as an Excel file.</p>
                <a href="/api/admin/download" class="btn-primary" style="display: inline-block; text-align: center; text-decoration: none;">DOWNLOAD EXCEL</a>
            </div>

            <div class="card mt-4">
                <h3>UPDATE MASTER DATA</h3>
                <p>Upload a new master Excel file to update distributor and retailer details.</p>
                <form id="upload-form" class="mt-2">
                    <input type="file" id="file-upload" name="file" accept=".xlsx" class="file-input">
                    <button type="submit" class="btn-secondary mt-2">UPLOAD & OVERWRITE</button>
                </form>
                <div id="upload-message" class="hidden mt-2"></div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('file-upload');
            const messageDiv = document.getElementById('upload-message');
            
            if (!fileInput.files.length) {
                messageDiv.textContent = 'Please select a file first.';
                messageDiv.className = 'alert alert-error mt-2';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            messageDiv.textContent = 'Uploading...';
            messageDiv.className = 'alert mt-2';

            try {
                const response = await fetch('/api/admin/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    messageDiv.textContent = result.message;
                    messageDiv.className = 'alert alert-success mt-2';
                    fileInput.value = '';
                } else {
                    messageDiv.textContent = result.error || 'Upload failed.';
                    messageDiv.className = 'alert alert-error mt-2';
                }
            } catch (error) {
                messageDiv.textContent = 'Network error.';
                messageDiv.className = 'alert alert-error mt-2';
            }
        });
    </script>
</body>
</html>
